{{- $root := . }}
{{- $ns := $root.Release.Namespace }}
{{- $controlSA := include "jumi.controlSA" $root }}
{{- $jobSA := include "jumi.jobSA" $root }}
{{- $reviewer := $root.Values.image.reviewer.repository }}
{{- $worker := $root.Values.image.worker.repository }}
{{- $secrets := include "jumi.jobSecretNames" $root }}
{{- $cms := include "jumi.jobConfigMapNames" $root }}
{{- $scs := include "jumi.jobStorageClasses" $root }}
{{- $policy := include "jumi.policyName" $root }}
{{- $fixedKeys := list "app.kubernetes.io/name" "app.kubernetes.io/instance" "app.kubernetes.io/component" }}
{{- $ctrlKeys := list "batch.kubernetes.io/controller-uid" "batch.kubernetes.io/job-name" "controller-uid" "job-name" }}
{{- $engAllowed := concat $fixedKeys (keys $root.Values.jobs.engine.podLabels) $ctrlKeys | toJson }}
{{- $workAllowed := concat $fixedKeys (keys $root.Values.jobs.worker.podLabels) $ctrlKeys | toJson }}
{{- $engSC := $root.Values.jobs.engine.storageClass }}
{{- $workSC := $root.Values.jobs.worker.storageClass }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $policy }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs"]
  matchConditions:
    - name: from-control-sa
      expression: >-
        request.userInfo.username == '{{ printf "system:serviceaccount:%s:%s" $ns $controlSA }}'
  validations:
    - message: image repository must match allowlist with tag or digest
      expression: >-
        object.spec.template.spec.containers.all(c, (c.image.startsWith({{ printf "%s:" $reviewer | quote }}) || c.image.startsWith({{ printf "%s@" $reviewer | quote }}) || c.image.startsWith({{ printf "%s:" $worker | quote }}) || c.image.startsWith({{ printf "%s@" $worker | quote }})))
    - message: init image must use a chart image
      expression: >-
        (!has(object.spec.template.spec.initContainers) || object.spec.template.spec.initContainers.all(c, (c.image.startsWith({{ printf "%s:" $reviewer | quote }}) || c.image.startsWith({{ printf "%s@" $reviewer | quote }}) || c.image.startsWith({{ printf "%s:" $worker | quote }}) || c.image.startsWith({{ printf "%s@" $worker | quote }}))))
    - message: job serviceAccountName is not the chart job account
      expression: >-
        object.spec.template.spec.serviceAccountName == {{ $jobSA | quote }} && (!has(object.spec.template.spec.serviceAccount) || object.spec.template.spec.serviceAccount == {{ $jobSA | quote }})
    - message: automountServiceAccountToken must be false
      expression: >-
        object.spec.template.spec.automountServiceAccountToken == false
    - message: hostNetwork hostPID hostIPC must be false
      expression: >-
        (!has(object.spec.template.spec.hostNetwork) || object.spec.template.spec.hostNetwork == false) && (!has(object.spec.template.spec.hostPID) || object.spec.template.spec.hostPID == false) && (!has(object.spec.template.spec.hostIPC) || object.spec.template.spec.hostIPC == false)
    - message: pod must run as 10001 with RuntimeDefault seccomp
      expression: >-
        has(object.spec.template.spec.securityContext) && object.spec.template.spec.securityContext.runAsNonRoot == true && object.spec.template.spec.securityContext.runAsUser == 10001 && object.spec.template.spec.securityContext.runAsGroup == 10001 && has(object.spec.template.spec.securityContext.seccompProfile) && object.spec.template.spec.securityContext.seccompProfile.type == 'RuntimeDefault'
    - message: containers must use the restricted security context
      expression: >-
        object.spec.template.spec.containers.all(c, has(c.securityContext) && c.securityContext.runAsNonRoot == true && c.securityContext.allowPrivilegeEscalation == false && has(c.securityContext.capabilities) && has(c.securityContext.capabilities.drop) && 'ALL' in c.securityContext.capabilities.drop && (!has(c.securityContext.capabilities.add) || size(c.securityContext.capabilities.add) == 0) && has(c.securityContext.seccompProfile) && c.securityContext.seccompProfile.type == 'RuntimeDefault')
    - message: initContainers must use the restricted security context
      expression: >-
        (!has(object.spec.template.spec.initContainers) || object.spec.template.spec.initContainers.all(c, has(c.securityContext) && c.securityContext.runAsNonRoot == true && c.securityContext.allowPrivilegeEscalation == false && has(c.securityContext.capabilities) && has(c.securityContext.capabilities.drop) && 'ALL' in c.securityContext.capabilities.drop && (!has(c.securityContext.capabilities.add) || size(c.securityContext.capabilities.add) == 0) && has(c.securityContext.seccompProfile) && c.securityContext.seccompProfile.type == 'RuntimeDefault'))
    - message: volumes must be emptyDir, ephemeral, or an allowlisted Secret or ConfigMap
      expression: >-
        object.spec.template.spec.volumes.all(v, has(v.emptyDir) || (has(v.ephemeral) && has(v.ephemeral.volumeClaimTemplate) && has(v.ephemeral.volumeClaimTemplate.spec) && has(v.ephemeral.volumeClaimTemplate.spec.accessModes) && v.ephemeral.volumeClaimTemplate.spec.accessModes == ['ReadWriteOnce'] && {{ if eq $scs "[]" }}(!has(v.ephemeral.volumeClaimTemplate.spec.storageClassName) || v.ephemeral.volumeClaimTemplate.spec.storageClassName in {{ $scs }}){{ else }}(has(v.ephemeral.volumeClaimTemplate.spec.storageClassName) && v.ephemeral.volumeClaimTemplate.spec.storageClassName in {{ $scs }}){{ end }} && (!has(v.ephemeral.volumeClaimTemplate.spec.volumeName) || v.ephemeral.volumeClaimTemplate.spec.volumeName == '') && !has(v.ephemeral.volumeClaimTemplate.spec.dataSource) && !has(v.ephemeral.volumeClaimTemplate.spec.dataSourceRef) && !has(v.ephemeral.volumeClaimTemplate.spec.selector)) || (has(v.secret) && v.secret.secretName in {{ $secrets }}) || (has(v.configMap) && v.configMap.name in {{ $cms }}))
    - message: env secretKeyRef must reference an allowlisted Secret
      expression: >-
        object.spec.template.spec.containers.all(c, !has(c.env) || c.env.all(e, !has(e.valueFrom) || !has(e.valueFrom.secretKeyRef) || e.valueFrom.secretKeyRef.name in {{ $secrets }}))
    - message: initContainer env secretKeyRef must reference an allowlisted Secret
      expression: >-
        (!has(object.spec.template.spec.initContainers) || object.spec.template.spec.initContainers.all(c, !has(c.env) || c.env.all(e, !has(e.valueFrom) || !has(e.valueFrom.secretKeyRef) || e.valueFrom.secretKeyRef.name in {{ $secrets }})))
    - message: envFrom secretRef must reference an allowlisted Secret
      expression: >-
        object.spec.template.spec.containers.all(c, !has(c.envFrom) || c.envFrom.all(ef, !has(ef.secretRef) || ef.secretRef.name in {{ $secrets }}))
    - message: initContainer envFrom secretRef must reference an allowlisted Secret
      expression: >-
        (!has(object.spec.template.spec.initContainers) || object.spec.template.spec.initContainers.all(c, !has(c.envFrom) || c.envFrom.all(ef, !has(ef.secretRef) || ef.secretRef.name in {{ $secrets }})))
    - message: env configMapKeyRef must reference an allowlisted ConfigMap
      expression: >-
        object.spec.template.spec.containers.all(c, !has(c.env) || c.env.all(e, !has(e.valueFrom) || !has(e.valueFrom.configMapKeyRef) || e.valueFrom.configMapKeyRef.name in {{ $cms }}))
    - message: initContainer env configMapKeyRef must reference an allowlisted ConfigMap
      expression: >-
        (!has(object.spec.template.spec.initContainers) || object.spec.template.spec.initContainers.all(c, !has(c.env) || c.env.all(e, !has(e.valueFrom) || !has(e.valueFrom.configMapKeyRef) || e.valueFrom.configMapKeyRef.name in {{ $cms }})))
    - message: envFrom configMapRef must reference an allowlisted ConfigMap
      expression: >-
        object.spec.template.spec.containers.all(c, !has(c.envFrom) || c.envFrom.all(ef, !has(ef.configMapRef) || ef.configMapRef.name in {{ $cms }}))
    - message: initContainer envFrom configMapRef must reference an allowlisted ConfigMap
      expression: >-
        (!has(object.spec.template.spec.initContainers) || object.spec.template.spec.initContainers.all(c, !has(c.envFrom) || c.envFrom.all(ef, !has(ef.configMapRef) || ef.configMapRef.name in {{ $cms }})))
    - message: job must carry the chart role labels
      expression: >-
        has(object.metadata.labels) && 'app.kubernetes.io/component' in object.metadata.labels && object.metadata.labels['app.kubernetes.io/component'] in ['engine', 'worker'] && 'app.kubernetes.io/instance' in object.metadata.labels && object.metadata.labels['app.kubernetes.io/instance'] == {{ $root.Release.Name | quote }}
    - message: job pods must carry the chart role labels
      expression: >-
        has(object.spec.template.metadata) && has(object.spec.template.metadata.labels) && 'app.kubernetes.io/component' in object.spec.template.metadata.labels && object.spec.template.metadata.labels['app.kubernetes.io/component'] in ['engine', 'worker']
    - message: engine job pods must only carry allowlisted labels
      expression: >-
        !has(object.metadata.labels) || !('app.kubernetes.io/component' in object.metadata.labels) || object.metadata.labels['app.kubernetes.io/component'] != 'engine' || (!has(object.spec.template.metadata) || !has(object.spec.template.metadata.labels) || object.spec.template.metadata.labels.all(k, k in {{ $engAllowed }}))
    - message: worker job pods must only carry allowlisted labels
      expression: >-
        !has(object.metadata.labels) || !('app.kubernetes.io/component' in object.metadata.labels) || object.metadata.labels['app.kubernetes.io/component'] != 'worker' || (!has(object.spec.template.metadata) || !has(object.spec.template.metadata.labels) || object.spec.template.metadata.labels.all(k, k in {{ $workAllowed }}))
    - message: engine claims must use the engine storage class
      expression: >-
        !has(object.metadata.labels) || !('app.kubernetes.io/component' in object.metadata.labels) || object.metadata.labels['app.kubernetes.io/component'] != 'engine' || object.spec.template.spec.volumes.all(v, !has(v.ephemeral) || !has(v.ephemeral.volumeClaimTemplate) || !has(v.ephemeral.volumeClaimTemplate.spec) || {{ if $engSC }}(has(v.ephemeral.volumeClaimTemplate.spec.storageClassName) && v.ephemeral.volumeClaimTemplate.spec.storageClassName == {{ $engSC | quote }}){{ else }}!has(v.ephemeral.volumeClaimTemplate.spec.storageClassName){{ end }})
    - message: worker claims must use the worker storage class
      expression: >-
        !has(object.metadata.labels) || !('app.kubernetes.io/component' in object.metadata.labels) || object.metadata.labels['app.kubernetes.io/component'] != 'worker' || object.spec.template.spec.volumes.all(v, !has(v.ephemeral) || !has(v.ephemeral.volumeClaimTemplate) || !has(v.ephemeral.volumeClaimTemplate.spec) || {{ if $workSC }}(has(v.ephemeral.volumeClaimTemplate.spec.storageClassName) && v.ephemeral.volumeClaimTemplate.spec.storageClassName == {{ $workSC | quote }}){{ else }}!has(v.ephemeral.volumeClaimTemplate.spec.storageClassName){{ end }})
    {{- range $k, $v := $root.Values.jobs.engine.volumeClaimLabels }}
    - message: engine claims must carry volumeClaimLabel {{ $k }}
      expression: >-
        !has(object.metadata.labels) || !('app.kubernetes.io/component' in object.metadata.labels) || object.metadata.labels['app.kubernetes.io/component'] != 'engine' || object.spec.template.spec.volumes.all(v, !has(v.ephemeral) || !has(v.ephemeral.volumeClaimTemplate) || (has(v.ephemeral.volumeClaimTemplate.metadata) && has(v.ephemeral.volumeClaimTemplate.metadata.labels) && {{ $k | quote }} in v.ephemeral.volumeClaimTemplate.metadata.labels && v.ephemeral.volumeClaimTemplate.metadata.labels[{{ $k | quote }}] == {{ $v | toString | quote }}))
    {{- end }}
    {{- range $k, $v := $root.Values.jobs.worker.volumeClaimLabels }}
    - message: worker claims must carry volumeClaimLabel {{ $k }}
      expression: >-
        !has(object.metadata.labels) || !('app.kubernetes.io/component' in object.metadata.labels) || object.metadata.labels['app.kubernetes.io/component'] != 'worker' || object.spec.template.spec.volumes.all(v, !has(v.ephemeral) || !has(v.ephemeral.volumeClaimTemplate) || (has(v.ephemeral.volumeClaimTemplate.metadata) && has(v.ephemeral.volumeClaimTemplate.metadata.labels) && {{ $k | quote }} in v.ephemeral.volumeClaimTemplate.metadata.labels && v.ephemeral.volumeClaimTemplate.metadata.labels[{{ $k | quote }}] == {{ $v | toString | quote }}))
    {{- end }}
    {{- if not (kindIs "invalid" $root.Values.jobs.engine.hostUsers) }}
    - message: engine Jobs must set hostUsers consistently
      expression: >-
        !has(object.metadata.labels) || !('app.kubernetes.io/component' in object.metadata.labels) || object.metadata.labels['app.kubernetes.io/component'] != 'engine' || (has(object.spec.template.spec.hostUsers) && object.spec.template.spec.hostUsers == {{ $root.Values.jobs.engine.hostUsers | toString }})
    {{- end }}
    {{- if not (kindIs "invalid" $root.Values.jobs.worker.hostUsers) }}
    - message: worker Jobs must set hostUsers consistently
      expression: >-
        !has(object.metadata.labels) || !('app.kubernetes.io/component' in object.metadata.labels) || object.metadata.labels['app.kubernetes.io/component'] != 'worker' || (has(object.spec.template.spec.hostUsers) && object.spec.template.spec.hostUsers == {{ $root.Values.jobs.worker.hostUsers | toString }})
    {{- end }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $policy }}
spec:
  policyName: {{ $policy }}
  validationActions: [Deny]
