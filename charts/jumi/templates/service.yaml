{{- include "jumi.validate" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "jumi.fullname" . }}-router
  labels:
    {{- include "jumi.labels" . | nindent 4 }}
    app.kubernetes.io/component: router
spec:
  type: {{ .Values.router.service.type }}
  selector:
    {{- include "jumi.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: router
  ports:
    - name: http
      port: {{ .Values.router.service.port }}
      targetPort: http
      protocol: TCP
