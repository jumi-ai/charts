---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "jumi.fullname" . }}
  labels:
    {{- include "jumi.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "jumi.controlSA" . }}
  labels:
    {{- include "jumi.labels" . | nindent 4 }}
    app.kubernetes.io/component: control
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "jumi.jobSA" . }}
  labels:
    {{- include "jumi.labels" . | nindent 4 }}
    app.kubernetes.io/component: job
automountServiceAccountToken: false
