{{- $root := . }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "jumi.fullname" $root }}-control
  labels:
    {{- include "jumi.labels" $root | nindent 4 }}
    app.kubernetes.io/component: control
spec:
  serviceName: {{ include "jumi.fullname" $root }}-control
  replicas: 1
  selector:
    matchLabels:
      {{- include "jumi.selectorLabels" $root | nindent 6 }}
      app.kubernetes.io/component: control
  template:
    metadata:
      labels:
        {{- include "jumi.selectorLabels" $root | nindent 8 }}
        app.kubernetes.io/component: control
        {{- with $root.Values.control.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $root.Values.control.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "jumi.controlSA" $root }}
      automountServiceAccountToken: true
      enableServiceLinks: false
      securityContext:
        {{- include "jumi.podSecurityContext" $root | nindent 8 }}
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $root.Values.postgres.enabled }}
      initContainers:
        - name: wait-for-postgres
          image: {{ include "jumi.image" (dict "root" $root "repository" $root.Values.image.reviewer.repository "tag" $root.Values.image.reviewer.tag) }}
          imagePullPolicy: {{ $root.Values.image.reviewer.pullPolicy }}
          securityContext:
            {{- include "jumi.containerSecurityContext" $root | nindent 12 }}
          command:
            - python3
            - -c
            - |
              import socket, sys, time
              host, port = sys.argv[1], int(sys.argv[2])
              for _ in range(60):
                  try:
                      socket.create_connection((host, port), 2).close()
                      sys.exit(0)
                  except OSError:
                      time.sleep(2)
              sys.exit(1)
            - {{ include "jumi.postgresHost" $root }}
            - "5432"
      {{- end }}
      containers:
        - name: control
          image: {{ include "jumi.image" (dict "root" $root "repository" $root.Values.image.reviewer.repository "tag" $root.Values.image.reviewer.tag) }}
          imagePullPolicy: {{ $root.Values.image.reviewer.pullPolicy }}
          args:
            - bun
            - run
            - src/control.ts
          securityContext:
            {{- include "jumi.containerSecurityContext" $root | nindent 12 }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
            {{- if $root.Values.codex.enabled }}
            - name: codex
              containerPort: 3010
              protocol: TCP
            {{- end }}
          env:
            - name: JUMI_ROLE
              value: control
            - name: HOME
              value: /data
            {{- include "jumi.databaseEnv" $root | nindent 12 }}
            - name: CONTROL_DISPATCH_ENGINE
              value: {{ $root.Values.control.dispatchEngine | toString | quote }}
            - name: CONTROL_DISPATCH_WORKER
              value: {{ $root.Values.control.dispatchWorker | toString | quote }}
            - name: CONTROL_ENGINE_MAX_JOBS
              value: {{ $root.Values.control.engineMaxJobs | toString | quote }}
            - name: CONTROL_WORKER_MAX_JOBS
              value: {{ $root.Values.control.workerMaxJobs | toString | quote }}
            - name: CONTROL_ENGINE_JOB_TEMPLATE_FILE
              value: /etc/jumi/jobs/engine.json
            - name: CONTROL_WORKER_JOB_TEMPLATE_FILE
              value: /etc/jumi/jobs/worker.json
            - name: CONTROL_DISPATCH_POLL_MS
              value: {{ $root.Values.control.dispatchPollMs | toString | quote }}
            - name: CONTROL_JOB_STARTUP_TIMEOUT_MS
              value: {{ $root.Values.control.jobStartupTimeoutMs | toString | quote }}
            {{- if $root.Values.codex.enabled }}
            - name: CONTROL_SECRET_NAME
              value: {{ include "jumi.codexSecretName" $root | quote }}
            - name: CONTROL_SECRET_NAMESPACE
              value: {{ $root.Release.Namespace | quote }}
            {{- end }}
            - name: OPENCODE_WELLKNOWN_URL
              value: {{ $root.Values.opencode.wellKnownUrl | quote }}
            {{- if $root.Values.opencode.model }}
            - name: OPENCODE_MODEL
              value: {{ $root.Values.opencode.model | quote }}
            {{- end }}
            {{- with $root.Values.extraEnv }}
            {{ toYaml . | nindent 12 }}
            {{- end }}
          {{- with $root.Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          resources:
            {{- toYaml $root.Values.control.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: jobs
              mountPath: /etc/jumi/jobs
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: jobs
          configMap:
            name: {{ include "jumi.fullname" $root }}-jobs
        {{- if not $root.Values.codex.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
  {{- if $root.Values.codex.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ $root.Values.control.persistence.size | quote }}
        {{- with $root.Values.control.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "jumi.fullname" $root }}-control
  labels:
    {{- include "jumi.labels" $root | nindent 4 }}
    app.kubernetes.io/component: control
spec:
  type: ClusterIP
  selector:
    {{- include "jumi.selectorLabels" $root | nindent 4 }}
    app.kubernetes.io/component: control
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
    {{- if $root.Values.codex.enabled }}
    - name: codex
      port: 3010
      targetPort: codex
      protocol: TCP
    {{- end }}
{{- if $root.Values.codex.enabled }}
---
# Fixed host for Codex device login (board targets `control:3010`).
# Only one Codex-enabled release fits in a namespace.
apiVersion: v1
kind: Service
metadata:
  name: control
  labels:
    {{- include "jumi.labels" $root | nindent 4 }}
    app.kubernetes.io/component: control
spec:
  type: ClusterIP
  selector:
    {{- include "jumi.selectorLabels" $root | nindent 4 }}
    app.kubernetes.io/component: control
  ports:
    - name: codex
      port: 3010
      targetPort: codex
      protocol: TCP
{{- end }}
