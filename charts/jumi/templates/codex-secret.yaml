{{- if .Values.codex.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "jumi.codexSecretName" . }}
  labels:
    {{- include "jumi.labels" . | nindent 4 }}
    app.kubernetes.io/component: codex
  # No data: control fills a token-only auth.json after install.
  # Helm upgrade keeps data written after install because the manifest
  # carries no data keys to overwrite.
type: Opaque
{{- end }}
