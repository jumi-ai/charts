{{- $root := . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "jumi.controlSA" $root }}
  labels:
    {{- include "jumi.labels" $root | nindent 4 }}
    app.kubernetes.io/component: control
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  {{- if $root.Values.codex.enabled }}
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ include "jumi.codexSecretName" $root | quote }}]
    verbs: ["get", "update"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "jumi.controlSA" $root }}
  labels:
    {{- include "jumi.labels" $root | nindent 4 }}
    app.kubernetes.io/component: control
subjects:
  - kind: ServiceAccount
    name: {{ include "jumi.controlSA" $root }}
    namespace: {{ $root.Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "jumi.controlSA" $root }}
  apiGroup: rbac.authorization.k8s.io
