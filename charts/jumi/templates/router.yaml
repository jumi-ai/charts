{{- include "jumi.validate" . }}
{{- $root := . }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "jumi.fullname" $root }}-router
  labels:
    {{- include "jumi.labels" $root | nindent 4 }}
    app.kubernetes.io/component: router
spec:
  replicas: {{ $root.Values.router.replicas }}
  selector:
    matchLabels:
      {{- include "jumi.selectorLabels" $root | nindent 6 }}
      app.kubernetes.io/component: router
  template:
    metadata:
      labels:
        {{- include "jumi.selectorLabels" $root | nindent 8 }}
        app.kubernetes.io/component: router
        {{- with $root.Values.router.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $root.Values.router.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "jumi.fullname" $root }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        {{- include "jumi.podSecurityContext" $root | nindent 8 }}
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $root.Values.postgres.enabled }}
      initContainers:
        - name: wait-for-postgres
          image: {{ include "jumi.image" (dict "root" $root "repository" $root.Values.image.reviewer.repository "tag" $root.Values.image.reviewer.tag) }}
          imagePullPolicy: {{ $root.Values.image.reviewer.pullPolicy }}
          securityContext:
            {{- include "jumi.containerSecurityContext" $root | nindent 12 }}
          command:
            - python3
            - -c
            - |
              import socket, sys, time
              host, port = sys.argv[1], int(sys.argv[2])
              for _ in range(60):
                  try:
                      socket.create_connection((host, port), 2).close()
                      sys.exit(0)
                  except OSError:
                      time.sleep(2)
              sys.exit(1)
            - {{ include "jumi.postgresHost" $root }}
            - "5432"
      {{- end }}
      containers:
        - name: jumi
          image: {{ include "jumi.image" (dict "root" $root "repository" $root.Values.image.reviewer.repository "tag" $root.Values.image.reviewer.tag) }}
          imagePullPolicy: {{ $root.Values.image.reviewer.pullPolicy }}
          args:
            - bun
            - run
            - src/server.ts
          securityContext:
            {{- include "jumi.containerSecurityContext" $root | nindent 12 }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
            - name: board
              containerPort: 3001
              protocol: TCP
          env:
            - name: JUMI_ROLE
              value: router
            {{- include "jumi.databaseEnv" $root | nindent 12 }}
            {{- include "jumi.forgeEnv" $root | nindent 12 }}
            {{- with $root.Values.extraEnv }}
            {{ toYaml . | nindent 12 }}
            {{- end }}
          {{- with $root.Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          resources:
            {{- toYaml $root.Values.router.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: work
              mountPath: /work
            - name: data
              mountPath: /data
      volumes:
        - name: tmp
          emptyDir: {}
        - name: work
          emptyDir: {}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "jumi.fullname" $root }}-router
  labels:
    {{- include "jumi.labels" $root | nindent 4 }}
    app.kubernetes.io/component: router
spec:
  type: {{ $root.Values.router.service.type }}
  selector:
    {{- include "jumi.selectorLabels" $root | nindent 4 }}
    app.kubernetes.io/component: router
  ports:
    - name: http
      port: {{ $root.Values.router.service.port }}
      targetPort: http
      protocol: TCP
{{- if $root.Values.router.board.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "jumi.fullname" $root }}-board
  labels:
    {{- include "jumi.labels" $root | nindent 4 }}
    app.kubernetes.io/component: router
spec:
  type: ClusterIP
  selector:
    {{- include "jumi.selectorLabels" $root | nindent 4 }}
    app.kubernetes.io/component: router
  ports:
    - name: board
      port: {{ $root.Values.router.board.port }}
      targetPort: board
      protocol: TCP
{{- end }}
