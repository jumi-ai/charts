name: Chart

on:
  pull_request:
  push:
    branches: [main]
    tags: ["jumi-v*"]

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: 1.7.12
      SHELLCHECK_VERSION: v0.11.0
      ZIZMOR_VERSION: 1.32.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Helm
        run: bash scripts/install-helm.sh
      - name: Lint and render
        run: bash scripts/render-check.sh
      - name: Admission policy coverage guard
        run: python3 scripts/policy-check.py --guard
      - name: Check workflows with actionlint
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 10 --retry-all-errors \
            -o /tmp/actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint
      - name: Check workflows with zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          min-severity: medium
          version: ${{ env.ZIZMOR_VERSION }}
      - name: Check scripts with shellcheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: scripts
          version: ${{ env.SHELLCHECK_VERSION }}
      - name: Public pull check regression
        run: |
          set -euo pipefail
          bash scripts/public-pull-check.sh 0.1.0
          if bash scripts/public-pull-check.sh 0.0.0-does-not-exist; then
            echo "public-pull-check unexpectedly passed for a nonexistent version" >&2
            exit 1
          fi
          echo "public-pull-check regression ok"

  contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Helm
        run: bash scripts/install-helm.sh
      - name: Contract drift check
        run: bash scripts/contract-check.sh
      - name: Classification fixture proof
        run: bash scripts/contract-keys-fixture-test.sh

  e2e:
    if: github.event_name == 'pull_request'
    needs: [lint, contract]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Helm
        run: bash scripts/install-helm.sh
      - name: Install kind
        run: |
          set -euo pipefail
          urls="https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64 https://github.com/kubernetes-sigs/kind/releases/download/v0.24.0/kind-linux-amd64"
          ok=0
          for i in 1 2 3 4 5; do
            for url in $urls; do
              if curl -fsSL --retry 3 --retry-delay 10 --retry-all-errors -o /tmp/kind "$url"; then
                ok=1
                break 2
              fi
              echo "kind download attempt $i from $url failed, retrying..." >&2
            done
            sleep 10
          done
          if [ "$ok" != 1 ]; then echo "kind download failed after 5 attempts" >&2; exit 1; fi
          chmod +x /tmp/kind
          sudo mv /tmp/kind /usr/local/bin/kind
          kind version
      - name: Create kind cluster
        run: |
          set -euo pipefail
          kind create cluster --image kindest/node:v1.30.0 --wait 120s
          kubectl cluster-info
          kubectl api-resources | grep -E "ValidatingAdmissionPolicy"
      - name: Install chart with bundled Postgres and Codex on
        run: |
          set -euo pipefail
          kubectl create namespace jumi-ci
          kubectl -n jumi-ci create secret generic jumi-secrets \
            --from-literal=GITEA_BOT_TOKEN=dummy \
            --from-literal=GITEA_WEBHOOK_SECRET=dummy \
            --from-literal=DATABASE_URL=postgres://jumi:dummy@postgres:5432/jumi \
            --from-literal=postgres-password=dummy-urlsafe-password
          helm install jumi ./charts/jumi -n jumi-ci \
            -f charts/jumi/ci/gitea-values.yaml \
            --set postgres.enabled=true \
            --set codex.enabled=true \
            --set jobs.engine.storageClass=standard \
            --set jobs.worker.storageClass=standard \
            --set jobs.worker.cache.enabled=true \
            --set jobs.worker.cache.existingClaim=jumi-cache \
            --set jobs.engine.hostUsers=false \
            --set jobs.worker.hostUsers=false \
            --set-json jobs.engine.volumeClaimLabels='{"example.com/backup":"false"}' \
            --set-json jobs.worker.volumeClaimLabels='{"example.com/backup":"false"}'
          kubectl -n jumi-ci rollout status deployment/jumi-router --timeout=300s
          kubectl -n jumi-ci rollout status statefulset/jumi-control --timeout=300s
          kubectl -n jumi-ci wait --for=condition=ready pod -l app.kubernetes.io/component=control --timeout=300s
          # readOnlyRootFilesystem must be on for router, control and Jobs
          kubectl -n jumi-ci get deployment jumi-router -o jsonpath='{.spec.template.spec.containers[*].securityContext.readOnlyRootFilesystem}' | grep -q true
          kubectl -n jumi-ci get statefulset jumi-control -o jsonpath='{.spec.template.spec.containers[*].securityContext.readOnlyRootFilesystem}' | grep -q true
          kubectl -n jumi-ci get configmap jumi-jobs -o "jsonpath={.data.engine\\.json}" | grep -q "readOnlyRootFilesystem"
          kubectl -n jumi-ci get configmap jumi-jobs -o "jsonpath={.data.worker\\.json}" | grep -q "readOnlyRootFilesystem"
      - name: Prove the admission policy
        run: |
          set -euo pipefail
          # The deny table lives in scripts/policy-check.py: each case names the
          # exact policy message it must be denied with. This step only creates
          # the kind objects (namespaces + installs) and calls the script.
          kubectl -n jumi-ci get configmap jumi-jobs -o "jsonpath={.data.engine\\.json}" > /tmp/engine.json
          kubectl -n jumi-ci get configmap jumi-jobs -o "jsonpath={.data.worker\\.json}" > /tmp/worker.json
          python3 scripts/policy-check.py --engine /tmp/engine.json --worker /tmp/worker.json --namespace jumi-ci
          # Every ci values file gets its own namespace + install so the chart's
          # own engine and worker Jobs are proven admitted under those values.
          # jumi-ci above already covers gitea-values with the featureful sets.
          for f in charts/jumi/ci/*-values.yaml; do
            base="$(basename "$f" "-values.yaml")"
            if [ "$base" = gitea ]; then
              continue
            fi
            ns="jumi-${base}"
            kubectl create namespace "$ns" --dry-run=client -o yaml | kubectl apply -f -
            if [ "$base" = hooks ]; then
              helm install jumi ./charts/jumi -n "$ns" \
                -f "$f" \
                --set jobs.engine.hostUsers=false \
                --set jobs.worker.hostUsers=false
            else
              helm install jumi ./charts/jumi -n "$ns" -f "$f"
            fi
          done
          for f in charts/jumi/ci/*-values.yaml; do
            base="$(basename "$f" "-values.yaml")"
            if [ "$base" = gitea ]; then
              ns="jumi-ci"
            else
              ns="jumi-${base}"
            fi
            kubectl -n "$ns" get configmap jumi-jobs -o "jsonpath={.data.engine\\.json}" > "/tmp/${base}-engine.json"
            kubectl -n "$ns" get configmap jumi-jobs -o "jsonpath={.data.worker\\.json}" > "/tmp/${base}-worker.json"
            python3 scripts/policy-check.py --engine "/tmp/${base}-engine.json" --worker "/tmp/${base}-worker.json" --namespace "$ns" --admit-only
          done
          # The deny table runs against gitea-values (jumi-ci, above) and
          # hooks-values, which is the one with init containers and hostUsers.
          python3 scripts/policy-check.py --engine /tmp/hooks-engine.json --worker /tmp/hooks-worker.json --namespace jumi-hooks
      - name: Run one Job with disk-backed /tmp and secrets tmpfs
        run: |
          set -euo pipefail
          as_control="system:serviceaccount:jumi-ci:jumi-control"
          python3 - <<'PY'
          import json
          from pathlib import Path
          job = json.loads(Path("/tmp/engine.json").read_text())
          job["metadata"]["name"] = "e2e-engine-run"
          Path("/tmp/e2e-engine-run.json").write_text(json.dumps(job))
          PY
          kubectl -n jumi-ci create -f /tmp/e2e-engine-run.json --as="$as_control"
          # wait for the pod to be created and the container to start
          # (Ready, Running, or terminated after start: the dummy row may exit fast)
          for _ in $(seq 1 60); do
            pod="$(kubectl -n jumi-ci get pod -l job-name=e2e-engine-run -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)"
            if [ -n "${pod:-}" ]; then
              state="$(kubectl -n jumi-ci get pod "$pod" -o jsonpath='{.status.containerStatuses[0].state}' 2>/dev/null || true)"
              case "$state" in
                *running*|*terminated*) echo "container started: $state"; break;;
              esac
            fi
            sleep 5
          done
          pod="$(kubectl -n jumi-ci get pod -l job-name=e2e-engine-run -o jsonpath='{.items[0].metadata.name}')"
          test -n "$pod"
          echo "job pod: $pod"
          # pod-spec proves /tmp is on the ephemeral claim and the secrets tmpfs is mounted
          kubectl -n jumi-ci get pod "$pod" -o json | python3 -c "
          import sys, json
          pod = json.load(sys.stdin)
          spec = pod['spec']
          vols = {v['name']: v for v in spec.get('volumes', [])}
          tmp = vols.get('tmp', {})
          assert 'ephemeral' in tmp, 'job pod /tmp is not on the ephemeral claim'
          storage = tmp['ephemeral']['volumeClaimTemplate']['spec']['resources']['requests']['storage']
          assert storage.endswith('Gi'), f'job pod /tmp storage is {storage}'
          sec = vols.get('secrets', {}).get('emptyDir', {})
          assert sec.get('medium') == 'Memory' and sec.get('sizeLimit') == '1Mi', 'secrets volume is not 1Mi tmpfs'
          c = next(c for c in spec['containers'] if c['name'] == 'jumi')
          env = {e['name']: e.get('value') for e in c.get('env', [])}
          assert env.get('JUMI_SECRETS_DIR') == '/run/jumi-secrets', 'JUMI_SECRETS_DIR not wired'
          mounts = {m['mountPath']: m['name'] for m in c.get('volumeMounts', [])}
          assert mounts.get('/tmp') == 'tmp', '/tmp mount missing'
          assert mounts.get('/run/jumi-secrets') == 'secrets', '/run/jumi-secrets mount missing'
          print('pod spec proves disk-backed /tmp + secrets tmpfs')
          "
          # the claim provisions a real PVC for the Job pod
          kubectl -n jumi-ci get pvc | grep -q "e2e-engine-run"
          # live checks while the container is still running
          if kubectl -n jumi-ci get pod "$pod" -o jsonpath='{.status.containerStatuses[0].state.running}' | grep -q .; then
            kubectl -n jumi-ci exec "$pod" -- sh -c "test \"\$JUMI_SECRETS_DIR\" = /run/jumi-secrets"
            kubectl -n jumi-ci exec "$pod" -- sh -c 'mount | grep " /run/jumi-secrets " | grep -q tmpfs'
            kubectl -n jumi-ci exec "$pod" -- sh -c 'df -T /tmp | tail -1 | grep -qv " tmpfs "'
            # the entrypoint's secrets file, when written, must live under /run/jumi-secrets, never /tmp
            kubectl -n jumi-ci exec "$pod" -- sh -c 'ls -l /run/jumi-secrets || true; if ls /tmp | grep -qi secret; then echo "secrets file leaked onto /tmp" >&2; exit 1; fi'
          else
            echo "container already exited; pod-spec checks above prove /tmp claim + secrets tmpfs wiring"
          fi
          kubectl -n jumi-ci delete job e2e-engine-run --wait=false || true
      - name: Prove Codex control:3010 from the router pod
        run: |
          set -euo pipefail
          kubectl -n jumi-ci exec deployment/jumi-router -- python3 -c "import socket; s=socket.create_connection(('control',3010),timeout=5); s.close(); print('control:3010 reachable')"
      - name: NetworkPolicy still allows router to control:3010
        run: |
          set -euo pipefail
          helm upgrade jumi ./charts/jumi -n jumi-ci \
            -f charts/jumi/ci/gitea-values.yaml \
            --set postgres.enabled=true \
            --set codex.enabled=true \
            --set networkPolicy.enabled=true \
            --set jobs.engine.storageClass=standard \
            --set jobs.worker.storageClass=standard \
            --set jobs.worker.cache.enabled=true \
            --set jobs.worker.cache.existingClaim=jumi-cache \
            --set jobs.engine.hostUsers=false \
            --set jobs.worker.hostUsers=false \
            --set-json jobs.engine.volumeClaimLabels='{"example.com/backup":"false"}' \
            --set-json jobs.worker.volumeClaimLabels='{"example.com/backup":"false"}'
          kubectl -n jumi-ci rollout status deployment/jumi-router --timeout=300s
          kubectl -n jumi-ci rollout status statefulset/jumi-control --timeout=300s
          kubectl -n jumi-ci exec deployment/jumi-router -- python3 -c "import socket; s=socket.create_connection(('control',3010),timeout=5); s.close(); print('control:3010 reachable with networkPolicy')"
          # a Job-labelled pod must not reach control:3010 when the CNI enforces policy
          appVersion="$(awk '/^appVersion:/{gsub(/"/, "", $2); print $2; exit}' charts/jumi/Chart.yaml)"
          kubectl -n jumi-ci run e2e-denied --image="ghcr.io/jumi-ai/jumi-reviewer:v${appVersion}" \
            --labels="app.kubernetes.io/name=jumi,app.kubernetes.io/instance=jumi,app.kubernetes.io/component=engine" \
            --command -- sleep 60
          kubectl -n jumi-ci wait --for=condition=ready pod/e2e-denied --timeout=120s
          if kubectl -n jumi-ci exec pod/e2e-denied -- python3 -c "import socket; socket.create_connection(('control',3010),timeout=5).close()"; then
            echo "kind CNI does not enforce NetworkPolicy; skipping Job-labelled deny check"
          else
            echo "Job-labelled pod correctly denied from control:3010"
          fi
          kubectl -n jumi-ci delete pod e2e-denied --wait=false
      - name: Upgrade keeps the token Secret data
        run: |
          set -euo pipefail
          kubectl -n jumi-ci patch secret jumi-codex-token -p '{"stringData":{"auth.json":"{\"e2e\":\"ok\"}"}}'
          helm upgrade jumi ./charts/jumi -n jumi-ci \
            -f charts/jumi/ci/gitea-values.yaml \
            --set postgres.enabled=true \
            --set codex.enabled=true \
            --set networkPolicy.enabled=true \
            --set jobs.engine.storageClass=standard \
            --set jobs.worker.storageClass=standard \
            --set jobs.worker.cache.enabled=true \
            --set jobs.worker.cache.existingClaim=jumi-cache \
            --set jobs.engine.hostUsers=false \
            --set jobs.worker.hostUsers=false \
            --set-json jobs.engine.volumeClaimLabels='{"example.com/backup":"false"}' \
            --set-json jobs.worker.volumeClaimLabels='{"example.com/backup":"false"}'
          kubectl -n jumi-ci rollout status statefulset/jumi-control --timeout=300s
          got="$(kubectl -n jumi-ci get secret jumi-codex-token -o jsonpath='{.data.auth\.json}')"
          if [ -z "$got" ]; then
            echo "token Secret data did not survive helm upgrade" >&2
            exit 1
          fi

  publish-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      registry:
        image: registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373 # 2.8.3
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Shallow, tag-free checkout: the publish script's
          # "only when jumi-v<version> doesn't exist" gate always passes
          # here, so the push path runs on every PR. The publish job uses
          # fetch-depth 0 so the same gate is real on main/tag pushes.
          fetch-depth: 1
          fetch-tags: false
      - name: Install Helm
        run: bash scripts/install-helm.sh
      - name: Wait for local registry
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:5000/v2/ >/dev/null 2>&1; then
              echo "local registry is up"
              exit 0
            fi
            sleep 2
          done
          echo "local registry did not start" >&2
          exit 1
      - name: Publish dry-run to local registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HELM_REGISTRY_USER: ${{ github.actor }}
        run: bash scripts/publish.sh --dry-run --registry oci://localhost:5000/charts
      - name: Pull back and verify chart versions
        run: |
          set -euo pipefail
          version="$(awk '/^version:/{print $2; exit}' charts/jumi/Chart.yaml)"
          app_version="$(awk '/^appVersion:/{gsub(/"/, "", $2); print $2; exit}' charts/jumi/Chart.yaml)"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          helm pull oci://localhost:5000/charts/jumi --version "$version" --plain-http \
            --destination "$work" --untar --untardir "$work/unpacked"
          pulled_version="$(awk '/^version:/{print $2; exit}' "$work/unpacked/jumi/Chart.yaml")"
          pulled_app="$(awk '/^appVersion:/{gsub(/"/, "", $2); print $2; exit}' "$work/unpacked/jumi/Chart.yaml")"
          if [ "$pulled_version" != "$version" ]; then
            echo "pulled version ${pulled_version} != Chart.yaml version ${version}" >&2
            exit 1
          fi
          if [ "$pulled_app" != "$app_version" ]; then
            echo "pulled appVersion ${pulled_app} != Chart.yaml appVersion ${app_version}" >&2
            exit 1
          fi
          echo "pulled back jumi ${pulled_version} (appVersion ${pulled_app}) from the local registry"

  publish:
    needs: [lint, contract]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/jumi-v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
        # zizmor: ignore[artipacked] -- the publish job pushes the release tag.
      - name: Install Helm
        run: bash scripts/install-helm.sh
      - name: Publish OCI chart and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HELM_REGISTRY_USER: ${{ github.actor }}
        run: bash scripts/publish.sh
      - name: Verify anonymous pull
        run: |
          set -euo pipefail
          version="$(awk '/^version:/{print $2; exit}' charts/jumi/Chart.yaml)"
          bash scripts/public-pull-check.sh "$version"
