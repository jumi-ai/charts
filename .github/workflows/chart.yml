name: Chart

on:
  pull_request:
  push:
    branches: [main]
    tags: ["jumi-v*"]

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Helm
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors \
              -o /tmp/helm.tgz https://get.helm.sh/helm-v3.22.1-linux-amd64.tar.gz; then
              break
            fi
            echo "helm download attempt $i failed, retrying..." >&2
            sleep 10
            if [ "$i" = 5 ]; then echo "helm download failed after 5 attempts" >&2; exit 1; fi
          done
          tar -xzf /tmp/helm.tgz -C /tmp
          sudo mv /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version
      - name: Lint and render
        run: bash scripts/render-check.sh
      - name: Public pull check regression
        run: |
          set -euo pipefail
          bash scripts/public-pull-check.sh 0.1.0
          if bash scripts/public-pull-check.sh 0.0.0-does-not-exist; then
            echo "public-pull-check unexpectedly passed for a nonexistent version" >&2
            exit 1
          fi
          echo "public-pull-check regression ok"

  contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Helm
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors \
              -o /tmp/helm.tgz https://get.helm.sh/helm-v3.22.1-linux-amd64.tar.gz; then
              break
            fi
            echo "helm download attempt $i failed, retrying..." >&2
            sleep 10
            if [ "$i" = 5 ]; then echo "helm download failed after 5 attempts" >&2; exit 1; fi
          done
          tar -xzf /tmp/helm.tgz -C /tmp
          sudo mv /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version
      - name: Contract drift check
        run: bash scripts/contract-check.sh

  e2e:
    if: github.event_name == 'pull_request'
    needs: [lint, contract]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Helm
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors \
              -o /tmp/helm.tgz https://get.helm.sh/helm-v3.22.1-linux-amd64.tar.gz; then
              break
            fi
            echo "helm download attempt $i failed, retrying..." >&2
            sleep 10
            if [ "$i" = 5 ]; then echo "helm download failed after 5 attempts" >&2; exit 1; fi
          done
          tar -xzf /tmp/helm.tgz -C /tmp
          sudo mv /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version
      - name: Install kind
        run: |
          set -euo pipefail
          urls="https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64 https://github.com/kubernetes-sigs/kind/releases/download/v0.24.0/kind-linux-amd64"
          ok=0
          for i in 1 2 3 4 5; do
            for url in $urls; do
              if curl -fsSL --retry 3 --retry-delay 10 --retry-all-errors -o /tmp/kind "$url"; then
                ok=1
                break 2
              fi
              echo "kind download attempt $i from $url failed, retrying..." >&2
            done
            sleep 10
          done
          if [ "$ok" != 1 ]; then echo "kind download failed after 5 attempts" >&2; exit 1; fi
          chmod +x /tmp/kind
          sudo mv /tmp/kind /usr/local/bin/kind
          kind version
      - name: Create kind cluster
        run: |
          set -euo pipefail
          kind create cluster --image kindest/node:v1.30.0 --wait 120s
          kubectl cluster-info
          kubectl api-resources | grep -E "ValidatingAdmissionPolicy"
      - name: Install chart with bundled Postgres and Codex on
        run: |
          set -euo pipefail
          kubectl create namespace jumi-ci
          kubectl -n jumi-ci create secret generic jumi-secrets \
            --from-literal=GITEA_BOT_TOKEN=dummy \
            --from-literal=GITEA_WEBHOOK_SECRET=dummy \
            --from-literal=DATABASE_URL=postgres://jumi:dummy@postgres:5432/jumi \
            --from-literal=postgres-password=dummy-urlsafe-password
          helm install jumi ./charts/jumi -n jumi-ci \
            -f charts/jumi/ci/gitea-values.yaml \
            --set postgres.enabled=true \
            --set codex.enabled=true
          kubectl -n jumi-ci rollout status deployment/jumi-router --timeout=300s
          kubectl -n jumi-ci rollout status statefulset/jumi-control --timeout=300s
          kubectl -n jumi-ci wait --for=condition=ready pod -l app.kubernetes.io/component=control --timeout=300s
          # readOnlyRootFilesystem must be on for router, control and Jobs
          kubectl -n jumi-ci get deployment jumi-router -o jsonpath='{.spec.template.spec.containers[*].securityContext.readOnlyRootFilesystem}' | grep -q true
          kubectl -n jumi-ci get statefulset jumi-control -o jsonpath='{.spec.template.spec.containers[*].securityContext.readOnlyRootFilesystem}' | grep -q true
          kubectl -n jumi-ci get configmap jumi-jobs -o "jsonpath={.data.engine\\.json}" | grep -q "readOnlyRootFilesystem"
          kubectl -n jumi-ci get configmap jumi-jobs -o "jsonpath={.data.worker\\.json}" | grep -q "readOnlyRootFilesystem"
      - name: Prove the admission policy
        run: |
          set -euo pipefail
          kubectl -n jumi-ci get configmap jumi-jobs -o "jsonpath={.data.engine\\.json}" > /tmp/engine.json
          kubectl -n jumi-ci get configmap jumi-jobs -o "jsonpath={.data.worker\\.json}" > /tmp/worker.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ("engine", "worker"):
              p = Path(f"/tmp/{name}.json")
              job = json.loads(p.read_text())
              job["metadata"]["name"] = f"e2e-{name}-ok"
              p.write_text(json.dumps(job))
              # variants, each violating exactly one rule
              base = json.loads(p.read_text())
              v = json.loads(json.dumps(base))
              v["metadata"]["name"] = f"e2e-{name}-hostpath"
              v["spec"]["template"]["spec"]["volumes"].append({"name": "bad", "hostPath": {"path": "/"}})
              v["spec"]["template"]["spec"]["containers"][0]["volumeMounts"].append({"name": "bad", "mountPath": "/bad"})
              Path(f"/tmp/{name}-hostpath.json").write_text(json.dumps(v))
              v = json.loads(json.dumps(base))
              v["metadata"]["name"] = f"e2e-{name}-envfrom"
              v["spec"]["template"]["spec"]["containers"][0].setdefault("envFrom", []).append({"secretRef": {"name": "not-allowlisted"}})
              Path(f"/tmp/{name}-envfrom.json").write_text(json.dumps(v))
              v = json.loads(json.dumps(base))
              v["metadata"]["name"] = f"e2e-{name}-image"
              v["spec"]["template"]["spec"]["containers"][0]["image"] = "ghcr.io/evil/other:latest"
              Path(f"/tmp/{name}-image.json").write_text(json.dumps(v))
              v = json.loads(json.dumps(base))
              v["metadata"]["name"] = f"e2e-{name}-automount"
              v["spec"]["template"]["spec"]["automountServiceAccountToken"] = True
              Path(f"/tmp/{name}-automount.json").write_text(json.dumps(v))
              # init container with envFrom to a non-allowlisted Secret
              v = json.loads(json.dumps(base))
              v["metadata"]["name"] = f"e2e-{name}-init-envfrom"
              main_sc = dict(v["spec"]["template"]["spec"]["containers"][0].get("securityContext", {}))
              main_img = v["spec"]["template"]["spec"]["containers"][0]["image"]
              v["spec"]["template"]["spec"].setdefault("initContainers", []).append({
                  "name": "bad-init",
                  "image": main_img,
                  "securityContext": main_sc,
                  "envFrom": [{"secretRef": {"name": "not-allowlisted"}}],
              })
              Path(f"/tmp/{name}-init-envfrom.json").write_text(json.dumps(v))
              # ephemeral volume with dataSourceRef to a PVC
              v = json.loads(json.dumps(base))
              v["metadata"]["name"] = f"e2e-{name}-datasourceref"
              v["spec"]["template"]["spec"]["volumes"].append({
                  "name": "bad-ds",
                  "ephemeral": {"volumeClaimTemplate": {"spec": {
                      "accessModes": ["ReadWriteOnce"],
                      "resources": {"requests": {"storage": "1Gi"}},
                      "dataSourceRef": {"kind": "PersistentVolumeClaim", "name": "some-pvc"},
                  }}},
              })
              v["spec"]["template"]["spec"]["containers"][0]["volumeMounts"].append({"name": "bad-ds", "mountPath": "/bad-ds"})
              Path(f"/tmp/{name}-datasourceref.json").write_text(json.dumps(v))
              # container with env.valueFrom.configMapKeyRef to a non-allowlisted ConfigMap
              v = json.loads(json.dumps(base))
              v["metadata"]["name"] = f"e2e-{name}-configkeyref"
              v["spec"]["template"]["spec"]["containers"][0].setdefault("env", []).append({
                  "name": "BAD_CM",
                  "valueFrom": {"configMapKeyRef": {"name": "not-allowlisted", "key": "k"}},
              })
              Path(f"/tmp/{name}-configkeyref.json").write_text(json.dumps(v))
          PY
          as_control="system:serviceaccount:jumi-ci:jumi-control"
          kubectl -n jumi-ci create -f /tmp/engine.json --as="$as_control" --dry-run=server -o name
          kubectl -n jumi-ci create -f /tmp/worker.json --as="$as_control" --dry-run=server -o name
          for variant in hostpath envfrom image automount init-envfrom datasourceref configkeyref; do
            for role in engine worker; do
              if kubectl -n jumi-ci create -f "/tmp/${role}-${variant}.json" --as="$as_control" --dry-run=server -o name 2>/tmp/deny.err; then
                echo "policy admitted ${role}-${variant} for control SA" >&2
                exit 1
              fi
              grep -i -E "denied|ValidatingAdmissionPolicy|allowlist|serviceAccount|automount|hostPath|secret|image" /tmp/deny.err >/dev/null || (cat /tmp/deny.err >&2; exit 1)
            done
          done
          # same commands as a different user are not matched by the policy:
          # no denial message from the policy itself
          if kubectl -n jumi-ci create -f /tmp/engine.json --as="system:serviceaccount:jumi-ci:jumi-job" --dry-run=server -o name 2>/tmp/other.err; then
            echo "unexpected admit for job SA (RBAC should deny)" >&2
            exit 1
          fi
          if grep -i "ValidatingAdmissionPolicy" /tmp/other.err; then
            echo "policy matched a different user" >&2
            cat /tmp/other.err >&2
            exit 1
          fi
      - name: Prove Codex control:3010 from the router pod
        run: |
          set -euo pipefail
          kubectl -n jumi-ci exec deployment/jumi-router -- python3 -c "import socket; s=socket.create_connection(('control',3010),timeout=5); s.close(); print('control:3010 reachable')"
      - name: NetworkPolicy still allows router to control:3010
        run: |
          set -euo pipefail
          helm upgrade jumi ./charts/jumi -n jumi-ci \
            -f charts/jumi/ci/gitea-values.yaml \
            --set postgres.enabled=true \
            --set codex.enabled=true \
            --set networkPolicy.enabled=true
          kubectl -n jumi-ci rollout status deployment/jumi-router --timeout=300s
          kubectl -n jumi-ci rollout status statefulset/jumi-control --timeout=300s
          kubectl -n jumi-ci exec deployment/jumi-router -- python3 -c "import socket; s=socket.create_connection(('control',3010),timeout=5); s.close(); print('control:3010 reachable with networkPolicy')"
          # a Job-labelled pod must not reach control:3010 when the CNI enforces policy
          kubectl -n jumi-ci run e2e-denied --image=ghcr.io/jumi-ai/jumi-reviewer:v10.4.0 \
            --labels="app.kubernetes.io/name=jumi,app.kubernetes.io/instance=jumi,app.kubernetes.io/component=engine" \
            --command -- sleep 60
          kubectl -n jumi-ci wait --for=condition=ready pod/e2e-denied --timeout=120s
          if kubectl -n jumi-ci exec pod/e2e-denied -- python3 -c "import socket; socket.create_connection(('control',3010),timeout=5).close()"; then
            echo "kind CNI does not enforce NetworkPolicy; skipping Job-labelled deny check"
          else
            echo "Job-labelled pod correctly denied from control:3010"
          fi
          kubectl -n jumi-ci delete pod e2e-denied --wait=false
      - name: Upgrade keeps the token Secret data
        run: |
          set -euo pipefail
          kubectl -n jumi-ci patch secret jumi-codex-token -p '{"stringData":{"auth.json":"{\"e2e\":\"ok\"}"}}'
          helm upgrade jumi ./charts/jumi -n jumi-ci \
            -f charts/jumi/ci/gitea-values.yaml \
            --set postgres.enabled=true \
            --set codex.enabled=true \
            --set networkPolicy.enabled=true
          kubectl -n jumi-ci rollout status statefulset/jumi-control --timeout=300s
          got="$(kubectl -n jumi-ci get secret jumi-codex-token -o jsonpath='{.data.auth\.json}')"
          if [ -z "$got" ]; then
            echo "token Secret data did not survive helm upgrade" >&2
            exit 1
          fi

  publish:
    needs: lint
    if: startsWith(github.ref, 'refs/tags/jumi-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Helm
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors \
              -o /tmp/helm.tgz https://get.helm.sh/helm-v3.22.1-linux-amd64.tar.gz; then
              break
            fi
            echo "helm download attempt $i failed, retrying..." >&2
            sleep 10
            if [ "$i" = 5 ]; then echo "helm download failed after 5 attempts" >&2; exit 1; fi
          done
          tar -xzf /tmp/helm.tgz -C /tmp
          sudo mv /tmp/linux-amd64/helm /usr/local/bin/helm
      - name: Publish OCI chart and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(awk '/^version:/{print $2; exit}' charts/jumi/Chart.yaml)"
          tag="${GITHUB_REF_NAME#jumi-v}"
          if [ "$tag" != "$version" ]; then
            echo "tag jumi-v${tag} does not match Chart.yaml version ${version}" >&2
            exit 1
          fi
          helm package charts/jumi
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "jumi-${version}.tgz" oci://ghcr.io/jumi-ai/charts
          gh release create "jumi-v${version}" "jumi-${version}.tgz" \
            --title "jumi ${version}" \
            --notes "$(printf 'Helm chart jumi %s.\n\n```bash\nhelm install jumi oci://ghcr.io/jumi-ai/charts/jumi --version %s\n```\n' "$version" "$version")"
      - name: Verify anonymous pull
        run: |
          set -euo pipefail
          version="$(awk '/^version:/{print $2; exit}' charts/jumi/Chart.yaml)"
          bash scripts/public-pull-check.sh "$version"
