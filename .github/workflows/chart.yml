name: Chart

on:
  pull_request:
  push:
    branches: [main]
    tags: ["jumi-v*"]

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Helm
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/helm.tgz https://get.helm.sh/helm-v3.18.6-linux-amd64.tar.gz
          tar -xzf /tmp/helm.tgz -C /tmp
          sudo mv /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version
      - name: Lint and render
        run: bash scripts/render-check.sh

  publish:
    needs: lint
    if: startsWith(github.ref, 'refs/tags/jumi-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Helm
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/helm.tgz https://get.helm.sh/helm-v3.18.6-linux-amd64.tar.gz
          tar -xzf /tmp/helm.tgz -C /tmp
          sudo mv /tmp/linux-amd64/helm /usr/local/bin/helm
      - name: Publish OCI chart
        run: |
          set -euo pipefail
          version="$(awk '/^version:/{print $2; exit}' charts/jumi/Chart.yaml)"
          tag="${GITHUB_REF_NAME#jumi-v}"
          if [ "$tag" != "$version" ]; then
            echo "tag jumi-v${tag} does not match Chart.yaml version ${version}" >&2
            exit 1
          fi
          helm package charts/jumi
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "jumi-${version}.tgz" oci://ghcr.io/jumi-ai/charts
