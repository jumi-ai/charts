name: Chart

on:
  pull_request:
  push:
    branches: [main]
    tags: ["jumi-v*"]

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Helm
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors \
              -o /tmp/helm.tgz https://get.helm.sh/helm-v3.22.1-linux-amd64.tar.gz; then
              break
            fi
            echo "helm download attempt $i failed, retrying..." >&2
            sleep 10
            if [ "$i" = 5 ]; then echo "helm download failed after 5 attempts" >&2; exit 1; fi
          done
          tar -xzf /tmp/helm.tgz -C /tmp
          sudo mv /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version
      - name: Lint and render
        run: bash scripts/render-check.sh

  contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Helm
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors \
              -o /tmp/helm.tgz https://get.helm.sh/helm-v3.22.1-linux-amd64.tar.gz; then
              break
            fi
            echo "helm download attempt $i failed, retrying..." >&2
            sleep 10
            if [ "$i" = 5 ]; then echo "helm download failed after 5 attempts" >&2; exit 1; fi
          done
          tar -xzf /tmp/helm.tgz -C /tmp
          sudo mv /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version
      - name: Contract drift check
        run: bash scripts/contract-check.sh

  e2e:
    if: github.event_name == 'pull_request'
    needs: [lint, contract]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Helm
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors \
              -o /tmp/helm.tgz https://get.helm.sh/helm-v3.22.1-linux-amd64.tar.gz; then
              break
            fi
            echo "helm download attempt $i failed, retrying..." >&2
            sleep 10
            if [ "$i" = 5 ]; then echo "helm download failed after 5 attempts" >&2; exit 1; fi
          done
          tar -xzf /tmp/helm.tgz -C /tmp
          sudo mv /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version
      - name: Install kind
        run: |
          set -euo pipefail
          urls="https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64 https://github.com/kubernetes-sigs/kind/releases/download/v0.24.0/kind-linux-amd64"
          ok=0
          for i in 1 2 3 4 5; do
            for url in $urls; do
              if curl -fsSL --retry 3 --retry-delay 10 --retry-all-errors -o /tmp/kind "$url"; then
                ok=1
                break 2
              fi
              echo "kind download attempt $i from $url failed, retrying..." >&2
            done
            sleep 10
          done
          if [ "$ok" != 1 ]; then echo "kind download failed after 5 attempts" >&2; exit 1; fi
          chmod +x /tmp/kind
          sudo mv /tmp/kind /usr/local/bin/kind
          kind version
      - name: Create kind cluster
        run: |
          set -euo pipefail
          kind create cluster --image kindest/node:v1.30.0 --wait 120s
          kubectl cluster-info
          kubectl api-resources | grep -E "ValidatingAdmissionPolicy"
      - name: Install chart with bundled Postgres and Codex on
        run: |
          set -euo pipefail
          kubectl create namespace jumi-ci
          kubectl -n jumi-ci create secret generic jumi-secrets \
            --from-literal=GITEA_BOT_TOKEN=dummy \
            --from-literal=GITEA_WEBHOOK_SECRET=dummy \
            --from-literal=DATABASE_URL=postgres://jumi:dummy@postgres:5432/jumi \
            --from-literal=postgres-password=dummy-urlsafe-password
          helm install jumi ./charts/jumi -n jumi-ci \
            -f charts/jumi/ci/gitea-values.yaml \
            --set postgres.enabled=true \
            --set codex.enabled=true
          kubectl -n jumi-ci rollout status deployment/jumi-router --timeout=300s
          kubectl -n jumi-ci rollout status statefulset/jumi-control --timeout=300s
          kubectl -n jumi-ci wait --for=condition=ready pod -l app.kubernetes.io/component=control --timeout=300s
      - name: Prove the admission policy
        run: |
          set -euo pipefail
          kubectl -n jumi-ci get configmap jumi-jobs -o "jsonpath={.data.engine\\.json}" > /tmp/engine.json
          kubectl -n jumi-ci get configmap jumi-jobs -o "jsonpath={.data.worker\\.json}" > /tmp/worker.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ("engine", "worker"):
              p = Path(f"/tmp/{name}.json")
              job = json.loads(p.read_text())
              job["metadata"]["name"] = f"e2e-{name}-ok"
              p.write_text(json.dumps(job))
              # variants, each violating exactly one rule
              base = json.loads(p.read_text())
              v = json.loads(json.dumps(base))
              v["metadata"]["name"] = f"e2e-{name}-hostpath"
              v["spec"]["template"]["spec"]["volumes"].append({"name": "bad", "hostPath": {"path": "/"}})
              v["spec"]["template"]["spec"]["containers"][0]["volumeMounts"].append({"name": "bad", "mountPath": "/bad"})
              Path(f"/tmp/{name}-hostpath.json").write_text(json.dumps(v))
              v = json.loads(json.dumps(base))
              v["metadata"]["name"] = f"e2e-{name}-envfrom"
              v["spec"]["template"]["spec"]["containers"][0].setdefault("envFrom", []).append({"secretRef": {"name": "not-allowlisted"}})
              Path(f"/tmp/{name}-envfrom.json").write_text(json.dumps(v))
              v = json.loads(json.dumps(base))
              v["metadata"]["name"] = f"e2e-{name}-image"
              v["spec"]["template"]["spec"]["containers"][0]["image"] = "ghcr.io/evil/other:latest"
              Path(f"/tmp/{name}-image.json").write_text(json.dumps(v))
              v = json.loads(json.dumps(base))
              v["metadata"]["name"] = f"e2e-{name}-automount"
              v["spec"]["template"]["spec"]["automountServiceAccountToken"] = True
              Path(f"/tmp/{name}-automount.json").write_text(json.dumps(v))
          PY
          as_control="system:serviceaccount:jumi-ci:jumi-control"
          kubectl create -f /tmp/engine.json --as="$as_control" --dry-run=server -o name
          kubectl create -f /tmp/worker.json --as="$as_control" --dry-run=server -o name
          for variant in hostpath envfrom image automount; do
            for role in engine worker; do
              if kubectl create -f "/tmp/${role}-${variant}.json" --as="$as_control" --dry-run=server -o name 2>/tmp/deny.err; then
                echo "policy admitted ${role}-${variant} for control SA" >&2
                exit 1
              fi
              grep -i -E "denied|ValidatingAdmissionPolicy|allowlist|serviceAccount|automount|hostPath|secret|image" /tmp/deny.err >/dev/null || (cat /tmp/deny.err >&2; exit 1)
            done
          done
          # same commands as a different user are not matched by the policy:
          # no denial message from the policy itself
          if kubectl create -f /tmp/engine.json --as="system:serviceaccount:jumi-ci:jumi-job" --dry-run=server -o name 2>/tmp/other.err; then
            echo "unexpected admit for job SA (RBAC should deny)" >&2
            exit 1
          fi
          if grep -i "ValidatingAdmissionPolicy" /tmp/other.err; then
            echo "policy matched a different user" >&2
            cat /tmp/other.err >&2
            exit 1
          fi
      - name: Upgrade keeps the token Secret data
        run: |
          set -euo pipefail
          kubectl -n jumi-ci patch secret jumi-codex-token -p '{"stringData":{"auth.json":"{\"e2e\":\"ok\"}"}}'
          helm upgrade jumi ./charts/jumi -n jumi-ci \
            -f charts/jumi/ci/gitea-values.yaml \
            --set postgres.enabled=true \
            --set codex.enabled=true
          kubectl -n jumi-ci rollout status statefulset/jumi-control --timeout=300s
          got="$(kubectl -n jumi-ci get secret jumi-codex-token -o jsonpath='{.data.auth\.json}')"
          if [ -z "$got" ]; then
            echo "token Secret data did not survive helm upgrade" >&2
            exit 1
          fi

  publish:
    needs: lint
    if: startsWith(github.ref, 'refs/tags/jumi-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Helm
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors \
              -o /tmp/helm.tgz https://get.helm.sh/helm-v3.22.1-linux-amd64.tar.gz; then
              break
            fi
            echo "helm download attempt $i failed, retrying..." >&2
            sleep 10
            if [ "$i" = 5 ]; then echo "helm download failed after 5 attempts" >&2; exit 1; fi
          done
          tar -xzf /tmp/helm.tgz -C /tmp
          sudo mv /tmp/linux-amd64/helm /usr/local/bin/helm
      - name: Publish OCI chart and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(awk '/^version:/{print $2; exit}' charts/jumi/Chart.yaml)"
          tag="${GITHUB_REF_NAME#jumi-v}"
          if [ "$tag" != "$version" ]; then
            echo "tag jumi-v${tag} does not match Chart.yaml version ${version}" >&2
            exit 1
          fi
          helm package charts/jumi
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "jumi-${version}.tgz" oci://ghcr.io/jumi-ai/charts
          gh release create "jumi-v${version}" "jumi-${version}.tgz" \
            --title "jumi ${version}" \
            --notes "$(printf 'Helm chart jumi %s.\n\n```bash\nhelm install jumi oci://ghcr.io/jumi-ai/charts/jumi --version %s\n```\n' "$version" "$version")"
      - name: Make the chart package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            /orgs/jumi-ai/packages/container/charts%2Fjumi \
            -f visibility=public
